<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyric Sync - LCB Gang</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --color-bg: #111827;
            --color-terminal: #000000;
            --color-text: #00FF7F;
            --color-accent: #1D4ED8;
            --color-shadow: rgba(0, 255, 127, 0.5);
            --color-past: #666;
            --color-select-bg: #222;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            min-height: 80vh;
            background-color: var(--color-terminal);
            border: 2px solid var(--color-text);
            box-shadow: 0 0 20px var(--color-shadow);
            padding: 20px;
            border-radius: 12px;
            animation: pulse 5s infinite alternate;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @keyframes pulse {
            0% { border-color: var(--color-text); box-shadow: 0 0 15px var(--color-shadow); }
            100% { border-color: var(--color-accent); box-shadow: 0 0 25px var(--color-accent), 0 0 5px var(--color-shadow); }
        }

        h1 { color: var(--color-text); text-align: center; margin-bottom: 5px; text-shadow: 0 0 5px var(--color-text); font-size: 2.5rem; }
        #metadata { color: #9ca3af; text-align: center; margin-bottom: 20px; font-size: 1rem; line-height: 1.5; }
        .instructions {
            color: #ccc; text-align: center; margin-bottom: 20px; font-size: 1.1rem;
            border: 1px dashed #444; padding: 10px; border-radius: 4px;
        }

        /* --- Lyric Display (Using scrollIntoView) --- */
        #lyric-display {
            position: relative; 
            overflow-y: auto;
            flex-grow: 1;
            min-height: 300px;
            padding: 10px 15px; 
            border: 1px solid var(--color-accent); 
            border-radius: 8px;
            background-color: #0d0d0d; 
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #lyric-display::-webkit-scrollbar {
            display: none;
        }

        #lyrics-wrapper { 
            width: 100%; 
            padding-top: 150px; 
            padding-bottom: 150px; 
            box-sizing: border-box;
        }

        .lyric-line {
            font-family: 'Roboto Mono', monospace;
            text-align: center;
            display: block; 
            padding: 10px 0;
            margin: 0;
            
            opacity: 0.2; 
            transform: scale(0.95);
            font-size: 1.5rem;
            color: #333;

            transition: 
                opacity 0.4s ease-out, 
                transform 0.4s ease-out, 
                color 0.4s ease-out, 
                font-size 0.4s ease-out;
            
            scroll-snap-align: center; 
        }
        
        .lyric-line.active {
            opacity: 1; 
            transform: scale(1.0); 
            color: var(--color-text);
            font-weight: 700; 
            text-shadow: 0 0 8px var(--color-text);
            font-size: 2.2rem;
        }

        .lyric-line.past {
            opacity: 0.35; 
            transform: scale(0.9); 
            color: var(--color-past); 
            font-size: 1.2rem;
        }
        
        /* --- Initial Play Overlay --- */
        #initial-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
            text-align: center;
            flex-direction: column;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        #initial-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none; /* Allows clicks to pass through once hidden */
        }
        
        #initial-overlay p {
            font-size: 1.8rem;
            color: var(--color-text);
            text-shadow: 0 0 10px var(--color-text);
            animation: blink 1.5s infinite alternate;
            padding: 20px;
            margin: 0;
        }

        #initial-overlay .sub-text {
            font-size: 1.2rem;
            color: #aaa;
            margin-top: 10px;
            animation: none;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }

        /* --- Controls & Selector (Same as before) --- */
        .selector-group { margin-bottom: 15px; padding-top: 5px; border-top: 1px solid #333; }

        #song-selector {
            width: 100%; padding: 15px 10px; font-size: 1.2rem; border-radius: 8px;
            background-color: var(--color-select-bg); color: var(--color-text);
            border: 2px solid var(--color-accent); cursor: pointer; appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path fill="%2300FF7F" d="M5 6l5 5 5-5z"/></svg>');
            background-repeat: no-repeat; background-position: right 10px center;
        }

        .control-groups { 
            display: flex; 
            justify-content: space-between; 
            gap: 10px; 
            margin-top: 20px; 
            flex-wrap: wrap; 
        }
        .main-button-group { display: flex; gap: 10px; flex-grow: 1; min-width: 50%; }
        .full-screen-group { flex-shrink: 0; display: flex; gap: 10px; }
        
        .control-groups button {
            padding: 15px 20px; font-size: 1.2rem; font-weight: 700;
            border: none; border-radius: 10px; cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        #prev-btn, #next-btn { background-color: #3b82f6; color: white; border: 2px solid #1d4ed8; flex-grow: 1; }
        #prev-btn:hover, #next-btn:hover { background-color: #2563eb; transform: translateY(-2px); }
        #prev-btn:disabled, #next-btn:disabled { background-color: #444; color: #999; cursor: not-allowed; border-color: #222; }
        
        #fullscreen-btn { background-color: #4b5563; color: #ccc; border: 2px solid #374151; }
        #fullscreen-btn:hover { background-color: #374151; transform: translateY(-2px); }
        
        #play-pause-btn { 
            background-color: #f59e0b;
            color: #111827; 
            border: 2px solid #b45309; 
        }
        #play-pause-btn:hover { background-color: #d97706; transform: translateY(-2px); }
        
        #restart-btn { 
            background-color: #ef4444; 
            color: white; 
            border: 2px solid #b91c1c; 
        }
        #restart-btn:hover { background-color: #dc2626; transform: translateY(-2px); }


        /* --- Mobile Optimization (Adjusted for better visibility) --- */
        @media (max-width: 600px) {
            body { 
                padding: 0; 
                align-items: flex-start; /* Ensure content starts at the top */
            }
            .container { 
                border-radius: 0; 
                padding: 15px;
                min-height: 100vh;
                border: none;
                box-shadow: none;
                /* Add vertical space to prevent buttons from touching the very bottom */
                padding-bottom: 20px; 
            } 
            h1 { font-size: 1.8rem; }
            #lyric-display { min-height: 250px; }
            .lyric-line.active { font-size: 1.8rem; }
            .lyric-line { font-size: 1.2rem; }
            
            .control-groups { 
                flex-direction: column; 
                gap: 10px; 
                margin-top: 20px; 
                width: 100%;
                /* Make control group sticky to ensure buttons stay visible at the bottom */
                position: sticky;
                bottom: 0;
                background-color: var(--color-terminal); 
                padding-top: 10px;
                z-index: 5;
            }
            .main-button-group, .full-screen-group { flex-direction: row; gap: 10px; width: 100%; }
            .control-groups button { 
                padding: 12px; 
                font-size: 1.1rem; 
                flex-grow: 1;
            }
        }
    </style>
</head>

    let currentSongIndex = 2; // Hero cuz LCB gang forever
    let currentLineIndex = 0; 
    let hasPlayedOnce = false; // New flag to track first play

    const songTitleEl = document.getElementById('song-title');
    const metadataEl = document.getElementById('metadata');
    const lyricsWrapper = document.getElementById('lyrics-wrapper');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const songSelector = document.getElementById('song-selector');
    const audioEl = document.getElementById('background-audio');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const initialOverlay = document.getElementById('initial-overlay'); // Get the new overlay

    // --- Core Functions ---

    function updatePlayPauseButton() {
        if (audioEl.paused) {
            playPauseBtn.textContent = 'PLAY (P)';
        } else {
            playPauseBtn.textContent = 'PAUSE (P)';
            // If successfully played, ensure the overlay is hidden
            if (!hasPlayedOnce) {
                hasPlayedOnce = true;
                initialOverlay.classList.add('hidden');
            }
        }
    }

    function togglePlayPause() {
        if (audioEl.paused) {
            audioEl.play().then(() => {
                // If play succeeds, hide the overlay permanently
                if (!hasPlayedOnce) {
                    hasPlayedOnce = true;
                    initialOverlay.classList.add('hidden');
                }
            }).catch(error => {
                console.error("Autoplay prevented:", error);
                // Keep the overlay visible if play is blocked
                initialOverlay.classList.remove('hidden');
            });
        } else {
            audioEl.pause();
        }
        updatePlayPauseButton();
    }
    
    function restartSong() {
        audioEl.pause();
        audioEl.currentTime = 0;
        
        currentLineIndex = 0;
        updateLyricDisplay();
        updatePlayPauseButton();
    }

    function loadSong(index) {
        currentSongIndex = parseInt(index);
        const song = songs[currentSongIndex];
        
        // 1. Update Metadata
        songTitleEl.textContent = song.title;
        let metaHtml = `By **${song.artist}** (${song.source})`;
        if (song.sinners) {
            const cantoInfo = song.sinners.map(sinner => SINNER_CANTO_MAP[sinner] || sinner).join(', ');
            metaHtml += `<br>Sinner: **${cantoInfo}**`;
        }
        metadataEl.innerHTML = metaHtml;

        // 2. Load Audio
        audioEl.src = song.audioSrc;
        audioEl.load();
        audioEl.pause();
        
        // 3. Render Lyrics
        renderLyrics(song.lyrics);
        
        // 4. Reset to the first line and controls
        currentLineIndex = 0;
        updateLyricDisplay();
        updateControlStates();

        // 5. Always show the overlay when a new song is loaded until play is clicked again
        if (!hasPlayedOnce) {
            initialOverlay.classList.remove('hidden');
        }
        updatePlayPauseButton();
    }

    function renderLyrics(lyrics) {
        lyricsWrapper.innerHTML = '';
        if (lyrics && lyrics.length > 0) {
            lyrics.forEach((line, index) => {
                const lineEl = document.createElement('p');
                lineEl.className = 'lyric-line';
                lineEl.id = `line-${index}`;
                lineEl.textContent = line.text || ' ';
                lyricsWrapper.appendChild(lineEl);
            });
        } else {
             lyricsWrapper.innerHTML = '<p class="lyric-line active">No lyrics available for this song. Please add them to the script.</p>';
        }
    }

    function updateLyricDisplay() {
        const lines = document.querySelectorAll('.lyric-line');
        lines.forEach((line, index) => {
            line.classList.remove('active', 'past');

            if (index === currentLineIndex) {
                line.classList.add('active');
                // Scroll the active line into view (centered)
                line.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (index < currentLineIndex) {
                line.classList.add('past');
            }
        });
        updateControlStates();
    }

    function updateControlStates() {
        const totalLines = songs[currentSongIndex].lyrics.length;
        prevBtn.disabled = currentLineIndex <= 0;
        nextBtn.disabled = currentLineIndex >= totalLines - 1;
    }

    function nextLyric() {
        const totalLines = songs[currentSongIndex].lyrics.length;
        if (currentLineIndex < totalLines - 1) {
            currentLineIndex++;
            if (audioEl.paused) {
                 // Try to jump forward 2 seconds if paused, to help sync
                 audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + 2.0);
            }
            updateLyricDisplay();
        }
    }

    function prevLyric() {
        if (currentLineIndex > 0) {
            currentLineIndex--;
            if (audioEl.paused) {
                // Try to jump backward 2 seconds if paused, to help sync
                audioEl.currentTime = Math.max(0, audioEl.currentTime - 2.0);
            }
            updateLyricDisplay();
        }
    }

    function toggleFullscreen() {
        const container = document.getElementById('main-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    // --- Initialization ---

    function initializeSelector() {
        songs.forEach((song, index) => {
            const option = document.createElement('option');
            const label = (song.source === "Limbus Company" && song.sinners && song.sinners.length > 0) 
                        ? `[LCB] ${song.title} (${song.sinners.join(', ')})` 
                        : `${song.title} (${song.artist})`;
            option.value = index;
            option.textContent = label;
            songSelector.appendChild(option);
        });
        songSelector.value = currentSongIndex;
    }

    // --- Keyboard Event Handler ---

    document.addEventListener('keydown', (event) => {
        // Prevent key events from triggering while user is typing in form elements (e.g., if we added a search bar later)
        if (event.target.tagName === 'INPUT' || event.target.tagName === 'SELECT' || event.target.tagName === 'TEXTAREA') {
            return;
        }

        switch (event.key.toUpperCase()) {
            case 'ARROWLEFT':
            case 'Q':
                event.preventDefault();
                prevLyric();
                break;
            case 'ARROWRIGHT':
            case 'E':
            case ' ':
                event.preventDefault();
                nextLyric();
                break;
            case 'P':
                event.preventDefault();
                togglePlayPause();
                break;
            case 'F':
                event.preventDefault();
                toggleFullscreen();
                break;
            case 'R':
                event.preventDefault();
                restartSong();
                break;
        }
    });

    // Add event listeners for audio state changes (to keep button label updated)
    audioEl.addEventListener('play', updatePlayPauseButton);
    audioEl.addEventListener('pause', updatePlayPauseButton);


    // --- Execute on Load ---

    initializeSelector();
    loadSong(currentSongIndex);
</script>
